<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
  <title id="title">Tangenti alla circonferenza passanti per l’origine</title>
  <desc id="desc">La circonferenza ha centro C due uno e raggio uno. Le rette y uguale zero e y uguale quattro terzi x passano per l’origine O e sono tangenti nei punti T uno due zero e T due sei quinti otto quinti.</desc>

  <defs>
    <pattern id="minorGrid" width="95" height="95" patternUnits="userSpaceOnUse">
      <path d="M 95 0 L 0 0 0 95" fill="none" stroke="#e8e1d7" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="190" height="190" patternUnits="userSpaceOnUse">
      <rect width="190" height="190" fill="url(#minorGrid)"/>
      <path d="M 190 0 L 0 0 0 190" fill="none" stroke="#cfc4b7" stroke-width="1.4"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#5d6873"/>
    </marker>
  </defs>

  <rect width="900" height="630" rx="10" fill="#fffdf8"/>
  <text x="450" y="33" text-anchor="middle" fill="#1f2933" font-family="Georgia, 'Times New Roman', serif" font-size="22">
    Circonferenza e rette tangenti passanti per O
  </text>

  <rect x="80" y="45" width="760" height="570" fill="url(#majorGrid)" stroke="#d7cfc3" stroke-width="1"/>

  <!-- Assi cartesiani -->
  <line x1="80" y1="520" x2="837" y2="520" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="175" y1="615" x2="175" y2="49" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="824" y="506" fill="#5d6873" font-family="Arial, sans-serif" font-size="18">x</text>
  <text x="188" y="66" fill="#5d6873" font-family="Arial, sans-serif" font-size="18">y</text>

  <!-- Tacche e valori interi -->
  <g fill="#5d6873" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="175" y="542">0</text>
    <text x="365" y="542">1</text>
    <text x="555" y="542">2</text>
    <text x="745" y="542">3</text>
  </g>
  <g fill="#5d6873" font-family="Arial, sans-serif" font-size="14" text-anchor="end">
    <text x="164" y="335">1</text>
    <text x="164" y="145">2</text>
  </g>

  <!-- Circonferenza: C(2,1), R=1 -->
  <circle cx="555" cy="330" r="190" fill="#8b5e3c" fill-opacity="0.08" stroke="#8b5e3c" stroke-width="4"/>

  <!-- Rette tangenti -->
  <line x1="80" y1="520" x2="840" y2="520" stroke="#2f6f74" stroke-width="4"/>
  <line x1="104" y1="615" x2="531" y2="45" stroke="#3f6fa3" stroke-width="4"/>

  <!-- Raggi di tangenza -->
  <line x1="555" y1="330" x2="555" y2="520" stroke="#c28a45" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="555" y1="330" x2="403" y2="216" stroke="#c28a45" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M555 494 h-26 v26" fill="none" stroke="#c28a45" stroke-width="2"/>
  <path d="M424 232 l16 -21 l21 16" fill="none" stroke="#c28a45" stroke-width="2"/>

  <!-- Punti -->
  <g stroke="#fffdf8" stroke-width="3">
    <circle cx="175" cy="520" r="8" fill="#1f2933"/>
    <circle cx="555" cy="330" r="8" fill="#8b5e3c"/>
    <circle cx="555" cy="520" r="8" fill="#2f6f74"/>
    <circle cx="403" cy="216" r="8" fill="#3f6fa3"/>
  </g>

  <!-- Etichette -->
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="151" y="550" fill="#1f2933">O</text>
    <text x="568" y="319" fill="#8b5e3c">C(2, 1)</text>
    <text x="568" y="510" fill="#2f6f74">T₁(2, 0)</text>
    <text x="418" y="205" fill="#3f6fa3">T₂(6/5, 8/5)</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic">
    <text x="692" y="505" fill="#2f6f74">r₁: y = 0</text>
    <text x="258" y="410" fill="#3f6fa3" transform="rotate(-53.13 258 410)">r₂: y = 4x/3</text>
  </g>
</svg>
